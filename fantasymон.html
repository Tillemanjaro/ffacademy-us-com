<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FantasyMon - Fantasy Football RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; image-rendering: pixelated; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }
  #gameCanvas {
    border: 4px solid #e8b84b;
    box-shadow: 0 0 40px #e8b84b44, 0 0 80px #e8b84b22;
    cursor: pointer;
  }
  #ui {
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }
  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 8px 14px;
    background: #2d2d5e;
    color: #e8b84b;
    border: 2px solid #e8b84b;
    cursor: pointer;
    transition: all 0.1s;
  }
  .btn:hover { background: #e8b84b; color: #1a1a2e; }
  .btn:active { transform: scale(0.95); }
</style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<canvas id="gameCanvas" width="480" height="320"></canvas>
<div id="ui">
  <button class="btn" id="btnA">A / CONFIRM</button>
  <button class="btn" id="btnB">B / BACK</button>
  <button class="btn" id="btnUp">▲</button>
  <button class="btn" id="btnDown">▼</button>
</div>

<script>
// ============================================================
// CANVAS & CONTEXT
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ============================================================
// CONSTANTS & COLORS
// ============================================================
const TYPES = {
  QB:  { name:'QB',  color:'#FF6B35', dark:'#cc4400', light:'#ff9966', icon:'🏈' },
  RB:  { name:'RB',  color:'#8B4513', dark:'#5a2d0c', light:'#c47a3d', icon:'🦵' },
  WR:  { name:'WR',  color:'#4169E1', dark:'#1a3fa0', light:'#6699ff', icon:'⚡' },
  TE:  { name:'TE',  color:'#228B22', dark:'#145214', light:'#44bb44', icon:'🛡️' },
  DEF: { name:'DEF', color:'#808080', dark:'#4d4d4d', light:'#aaaaaa', icon:'🏛️' },
  K:   { name:'K',   color:'#9932CC', dark:'#5c1e7a', light:'#cc66ff', icon:'🥾' }
};

// Type effectiveness chart: attacker -> [2x effective against, 0.5x against]
const TYPE_CHART = {
  QB:  { strong:['DEF','K'],   weak:['WR','RB'] },
  RB:  { strong:['QB','TE'],   weak:['DEF','WR'] },
  WR:  { strong:['RB','DEF'],  weak:['TE','QB'] },
  TE:  { strong:['WR','QB'],   weak:['RB','K'] },
  DEF: { strong:['TE','RB'],   weak:['QB','K'] },
  K:   { strong:['WR','DEF'],  weak:['QB','TE'] }
};

function getEffectiveness(attackType, defType) {
  const chart = TYPE_CHART[attackType];
  if (!chart) return 1;
  if (chart.strong.includes(defType)) return 2.0;
  if (chart.weak.includes(defType))   return 0.5;
  return 1.0;
}

// ============================================================
// SPRITE DRAWING FUNCTIONS
// ============================================================
function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function drawSprite(player, cx, cy, scale=1, flip=false) {
  const s = scale;
  ctx.save();
  if (flip) {
    ctx.translate(cx * 2, 0);
    ctx.scale(-1, 1);
    cx = cx; // still draw at cx but flipped
  }
  player.drawFn(ctx, cx, cy, s);
  ctx.restore();
}

// ---- Sprite: QB (throwing pose) ----
function drawQB(ctx, cx, cy, s, colors) {
  const c = colors;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy+55*s, 18*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
  // Cleats
  drawPixelRect(cx-14*s, cy+50*s, 11*s, 6*s, '#222');
  drawPixelRect(cx+3*s,  cy+52*s, 11*s, 6*s, '#222');
  // Pants
  drawPixelRect(cx-14*s, cy+34*s, 12*s, 18*s, c.pants);
  drawPixelRect(cx+2*s,  cy+36*s, 12*s, 18*s, c.pants);
  // Jersey body
  drawPixelRect(cx-15*s, cy+16*s, 30*s, 22*s, c.jersey);
  // Jersey number
  ctx.fillStyle = c.number;
  ctx.font = `bold ${9*s}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(c.num, cx, cy+32*s);
  // Left arm (down)
  drawPixelRect(cx-22*s, cy+18*s, 8*s, 16*s, c.jersey);
  drawPixelRect(cx-22*s, cy+32*s, 8*s, 8*s, c.skin);
  // Right arm (raised - throwing)
  drawPixelRect(cx+14*s, cy+8*s,  8*s, 18*s, c.jersey);
  drawPixelRect(cx+14*s, cy+2*s,  8*s, 10*s, c.skin);
  // Ball in right hand
  ctx.fillStyle = '#8B4513';
  ctx.beginPath(); ctx.ellipse(cx+22*s, cy+4*s, 6*s, 4*s, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1*s;
  ctx.beginPath(); ctx.moveTo(cx+18*s, cy+4*s); ctx.lineTo(cx+26*s, cy+4*s); ctx.stroke();
  // Helmet
  ctx.fillStyle = c.helmet;
  ctx.beginPath(); ctx.arc(cx, cy+6*s, 14*s, 0, Math.PI*2); ctx.fill();
  // Facemask
  ctx.strokeStyle = c.facemask;
  ctx.lineWidth = 2.5*s;
  ctx.beginPath();
  ctx.moveTo(cx-8*s, cy+10*s); ctx.lineTo(cx+8*s, cy+10*s);
  ctx.moveTo(cx-8*s, cy+14*s); ctx.lineTo(cx+8*s, cy+14*s);
  ctx.stroke();
  // Visor strip
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  drawPixelRect(cx-13*s, cy, 26*s, 6*s, 'rgba(0,0,0,0.35)');
}

// ---- Sprite: RB (running pose) ----
function drawRB(ctx, cx, cy, s, colors) {
  const c = colors;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy+55*s, 18*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
  // Legs running (offset)
  drawPixelRect(cx-12*s, cy+34*s, 11*s, 22*s, c.pants);
  drawPixelRect(cx+4*s,  cy+38*s, 11*s, 18*s, c.pants);
  drawPixelRect(cx-14*s, cy+52*s, 13*s, 6*s, '#222');
  drawPixelRect(cx+2*s,  cy+50*s, 13*s, 6*s, '#222');
  // Jersey body (stocky)
  drawPixelRect(cx-18*s, cy+16*s, 36*s, 22*s, c.jersey);
  ctx.fillStyle = c.number;
  ctx.font = `bold ${9*s}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(c.num, cx, cy+32*s);
  // Left arm (forward, tucking ball)
  drawPixelRect(cx-24*s, cy+20*s, 8*s, 12*s, c.jersey);
  drawPixelRect(cx-22*s, cy+30*s, 8*s, 8*s, c.skin);
  // Right arm (back)
  drawPixelRect(cx+16*s, cy+22*s, 8*s, 12*s, c.jersey);
  drawPixelRect(cx+16*s, cy+32*s, 8*s, 8*s, c.skin);
  // Ball tucked
  ctx.fillStyle = '#8B4513';
  ctx.beginPath(); ctx.ellipse(cx-18*s, cy+28*s, 7*s, 5*s, 0.4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2*s;
  ctx.beginPath(); ctx.moveTo(cx-22*s, cy+28*s); ctx.lineTo(cx-14*s, cy+28*s); ctx.stroke();
  // Helmet (wide, RB style)
  ctx.fillStyle = c.helmet;
  ctx.beginPath(); ctx.arc(cx, cy+5*s, 15*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = c.facemask;
  ctx.lineWidth = 2.5*s;
  ctx.beginPath();
  ctx.moveTo(cx-9*s, cy+9*s); ctx.lineTo(cx+9*s, cy+9*s);
  ctx.moveTo(cx-9*s, cy+14*s); ctx.lineTo(cx+9*s, cy+14*s);
  ctx.stroke();
  drawPixelRect(cx-14*s, cy-1*s, 28*s, 6*s, 'rgba(0,0,0,0.3)');
}

// ---- Sprite: WR (jump/catch pose) ----
function drawWR(ctx, cx, cy, s, colors) {
  const c = colors;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy+55*s, 14*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
  // Legs (jumping - one raised)
  drawPixelRect(cx-10*s, cy+36*s, 9*s, 18*s, c.pants);
  drawPixelRect(cx+3*s,  cy+32*s, 9*s, 14*s, c.pants);
  drawPixelRect(cx+3*s,  cy+42*s, 9*s, 8*s, c.pants);
  drawPixelRect(cx-12*s, cy+50*s, 12*s, 6*s, '#222');
  drawPixelRect(cx+1*s,  cy+48*s, 12*s, 6*s, '#222');
  // Jersey (slim)
  drawPixelRect(cx-14*s, cy+14*s, 28*s, 24*s, c.jersey);
  ctx.fillStyle = c.number;
  ctx.font = `bold ${9*s}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(c.num, cx, cy+30*s);
  // Both arms up (catching)
  drawPixelRect(cx-20*s, cy+8*s, 7*s, 16*s, c.jersey);
  drawPixelRect(cx-20*s, cy+4*s, 7*s, 8*s, c.skin);
  drawPixelRect(cx+13*s, cy+6*s, 7*s, 16*s, c.jersey);
  drawPixelRect(cx+13*s, cy+2*s, 7*s, 8*s, c.skin);
  // Ball above hands
  ctx.fillStyle = '#8B4513';
  ctx.beginPath(); ctx.ellipse(cx, cy+2*s, 7*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2*s;
  ctx.beginPath(); ctx.moveTo(cx-5*s, cy+2*s); ctx.lineTo(cx+5*s, cy+2*s); ctx.stroke();
  // Helmet
  ctx.fillStyle = c.helmet;
  ctx.beginPath(); ctx.arc(cx, cy+10*s, 12*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = c.facemask;
  ctx.lineWidth = 2*s;
  ctx.beginPath();
  ctx.moveTo(cx-7*s, cy+13*s); ctx.lineTo(cx+7*s, cy+13*s);
  ctx.stroke();
  drawPixelRect(cx-11*s, cy+3*s, 22*s, 5*s, 'rgba(0,0,0,0.3)');
}

// ---- Sprite: TE (blocking/power pose) ----
function drawTE(ctx, cx, cy, s, colors) {
  const c = colors;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy+55*s, 20*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
  drawPixelRect(cx-16*s, cy+50*s, 14*s, 7*s, '#222');
  drawPixelRect(cx+2*s,  cy+50*s, 14*s, 7*s, '#222');
  drawPixelRect(cx-16*s, cy+32*s, 14*s, 20*s, c.pants);
  drawPixelRect(cx+2*s,  cy+32*s, 14*s, 20*s, c.pants);
  // Big jersey (TE is big)
  drawPixelRect(cx-20*s, cy+14*s, 40*s, 22*s, c.jersey);
  ctx.fillStyle = c.number;
  ctx.font = `bold ${10*s}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(c.num, cx, cy+30*s);
  // Arms out (blocking)
  drawPixelRect(cx-28*s, cy+16*s, 10*s, 14*s, c.jersey);
  drawPixelRect(cx-28*s, cy+28*s, 10*s, 8*s, c.skin);
  drawPixelRect(cx+18*s, cy+16*s, 10*s, 14*s, c.jersey);
  drawPixelRect(cx+18*s, cy+28*s, 10*s, 8*s, c.skin);
  // Big helmet
  ctx.fillStyle = c.helmet;
  ctx.beginPath(); ctx.arc(cx, cy+4*s, 16*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = c.facemask;
  ctx.lineWidth = 3*s;
  ctx.beginPath();
  ctx.moveTo(cx-10*s, cy+8*s); ctx.lineTo(cx+10*s, cy+8*s);
  ctx.moveTo(cx-10*s, cy+14*s); ctx.lineTo(cx+10*s, cy+14*s);
  ctx.stroke();
  drawPixelRect(cx-15*s, cy-4*s, 30*s, 6*s, 'rgba(0,0,0,0.3)');
}

// ---- Sprite: DEF (defensive lineman) ----
function drawDEF(ctx, cx, cy, s, colors) {
  const c = colors;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy+55*s, 20*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
  drawPixelRect(cx-15*s, cy+50*s, 13*s, 7*s, '#222');
  drawPixelRect(cx+2*s,  cy+50*s, 13*s, 7*s, '#222');
  drawPixelRect(cx-15*s, cy+30*s, 13*s, 22*s, c.pants);
  drawPixelRect(cx+2*s,  cy+30*s, 13*s, 22*s, c.pants);
  // Low stance body
  drawPixelRect(cx-18*s, cy+18*s, 36*s, 16*s, c.jersey);
  ctx.fillStyle = c.number;
  ctx.font = `bold ${9*s}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(c.num, cx, cy+30*s);
  // Arms forward (rush)
  drawPixelRect(cx-26*s, cy+14*s, 10*s, 12*s, c.jersey);
  drawPixelRect(cx-26*s, cy+24*s, 8*s, 8*s, c.skin);
  drawPixelRect(cx+16*s, cy+14*s, 10*s, 12*s, c.jersey);
  drawPixelRect(cx+18*s, cy+24*s, 8*s, 8*s, c.skin);
  // Helmet (large)
  ctx.fillStyle = c.helmet;
  ctx.beginPath(); ctx.arc(cx, cy+6*s, 15*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = c.facemask;
  ctx.lineWidth = 2.5*s;
  ctx.beginPath();
  ctx.moveTo(cx-10*s, cy+10*s); ctx.lineTo(cx+10*s, cy+10*s);
  ctx.moveTo(cx-7*s,  cy+16*s); ctx.lineTo(cx+7*s,  cy+16*s);
  ctx.stroke();
  drawPixelRect(cx-14*s, cy-1*s, 28*s, 6*s, 'rgba(0,0,0,0.3)');
}

// ---- Sprite: K (kicker pose) ----
function drawK(ctx, cx, cy, s, colors) {
  const c = colors;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy+55*s, 14*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
  // Kicking leg up
  drawPixelRect(cx-10*s, cy+34*s, 9*s, 20*s, c.pants);
  // Kick leg raised at angle
  ctx.save();
  ctx.translate(cx+5*s, cy+38*s);
  ctx.rotate(-0.7);
  drawPixelRect(-5*s, -6*s, 9*s, 20*s, c.pants);
  drawPixelRect(-5*s, 12*s, 11*s, 6*s, '#222');
  ctx.restore();
  drawPixelRect(cx-12*s, cy+50*s, 12*s, 6*s, '#222');
  // Jersey (slim)
  drawPixelRect(cx-13*s, cy+14*s, 26*s, 24*s, c.jersey);
  ctx.fillStyle = c.number;
  ctx.font = `bold ${8*s}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(c.num, cx, cy+30*s);
  // Arms out for balance
  drawPixelRect(cx-22*s, cy+20*s, 10*s, 8*s, c.jersey);
  drawPixelRect(cx+12*s, cy+18*s, 10*s, 8*s, c.jersey);
  // Helmet
  ctx.fillStyle = c.helmet;
  ctx.beginPath(); ctx.arc(cx, cy+8*s, 12*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = c.facemask;
  ctx.lineWidth = 2*s;
  ctx.beginPath();
  ctx.moveTo(cx-8*s, cy+12*s); ctx.lineTo(cx+8*s, cy+12*s); ctx.stroke();
  drawPixelRect(cx-11*s, cy+1*s, 22*s, 5*s, 'rgba(0,0,0,0.3)');
}

function pxFont(size) { return `${size}px 'Press Start 2P', monospace`; }

function fillRoundRect(x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w,y, x+w,y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w,y+h, x+w-r,y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x,y+h, x,y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x,y, x+r,y, r);
  ctx.closePath(); ctx.fill();
}

function strokeRoundRect(x, y, w, h, r, color, lw=2) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w,y, x+w,y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w,y+h, x+w-r,y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x,y+h, x,y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x,y, x+r,y, r);
  ctx.closePath(); ctx.stroke();
}

function drawHPBar(x, y, w, h, current, max, label='') {
  const pct = Math.max(0, current/max);
  const barColor = pct > 0.5 ? '#44dd44' : pct > 0.25 ? '#ffcc00' : '#ff4444';
  // Background
  fillRoundRect(x, y, w, h, 3, '#222');
  // Fill
  fillRoundRect(x+1, y+1, Math.floor((w-2)*pct), h-2, 2, barColor);
  strokeRoundRect(x, y, w, h, 3, '#888', 1);
  if (label) {
    ctx.fillStyle = '#ccc';
    ctx.font = pxFont(6);
    ctx.textAlign = 'left';
    ctx.fillText(label, x, y-3);
  }
}

function drawTypeTag(type, x, y) {
  const t = TYPES[type];
  fillRoundRect(x, y, 38, 14, 4, t.color);
  ctx.fillStyle = '#fff';
  ctx.font = pxFont(6);
  ctx.textAlign = 'center';
  ctx.fillText(type, x+19, y+10);
}

function wrap(text, maxChars) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    if ((line+' '+w).trim().length > maxChars) { lines.push(line.trim()); line = w; }
    else line = (line+' '+w).trim();
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
// DIALOG SYSTEM
// ============================================================
function showDialog(text) {
  G.currentText = text;
  G.textIndex = 0;
  G.isTyping = true;
  G.dialogDone = false;
}

function updateDialog() {
  if (G.isTyping) {
    G.textTimer++;
    if (G.textTimer % 2 === 0) {
      G.textIndex = Math.min(G.textIndex+1, G.currentText.length);
      if (G.textIndex >= G.currentText.length) {
        G.isTyping = false;
        G.dialogDone = true;
      }
      G.textTimer = 0;
    }
  }
}

function drawDialogBox(x, y, w, h, text, showCursor=true) {
  fillRoundRect(x, y, w, h, 6, '#0d0d2b');
  strokeRoundRect(x, y, w, h, 6, '#e8b84b', 2);
  const shown = G.isTyping ? text.substring(0, G.textIndex) : text;
  const lines = wrap(shown, Math.floor((w-20)/7));
  ctx.fillStyle = '#ffffff';
  ctx.font = pxFont(8);
  ctx.textAlign = 'left';
  lines.forEach((l,i) => ctx.fillText(l, x+10, y+18+i*16));
  if (G.dialogDone && showCursor && G.tick%30<15) {
    ctx.fillStyle = '#e8b84b';
    ctx.fillText('▼', x+w-18, y+h-8);
  }
}

function drawTitle() {

  ctx.fillStyle = grad; ctx.fillRect(0,0,480,320);

  // Stars
  ctx.fillStyle = '#ffffff';
  [[40,30],[120,50],[200,20],[300,40],[400,25],[60,80],[350,70],[450,45]].forEach(([sx,sy])=>{
    const twinkle = Math.sin(G.titleAnim*0.05 + sx) * 0.5 + 0.5;
    ctx.globalAlpha = twinkle;
    ctx.fillRect(sx, sy, 2, 2);
  });
  ctx.globalAlpha = 1;

  // Field at bottom
  const fieldGrad = ctx.createLinearGradient(0,200,0,320);
  fieldGrad.addColorStop(0,'#1a5e1a'); fieldGrad.addColorStop(1,'#0d3d0d');
  ctx.fillStyle = fieldGrad; ctx.fillRect(0,200,480,120);

  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,220); ctx.lineTo(480,220); ctx.stroke();

  // Bouncing football
  const ballY = 160 + Math.sin(G.titleAnim*0.05)*20;
  const ballRot = G.titleAnim * 0.05;
  ctx.save(); ctx.translate(240, ballY); ctx.rotate(ballRot);
  ctx.fillStyle = '#8B4513';
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-15,0); ctx.lineTo(15,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(0,10); ctx.stroke();
  ctx.restore();

  // Title text
  ctx.fillStyle = '#FFB612';
  ctx.font = pxFont(32);
  ctx.textAlign = 'center';
  ctx.shadowColor = '#E31837'; ctx.shadowBlur = 20;
  ctx.fillText('FANTASYMON', 240, 80);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#ffffff';
  ctx.font = pxFont(10);
  ctx.fillText('FANTASY FOOTBALL RPG', 240, 100);

  if (G.tick%40<25) {
    ctx.fillStyle = '#e8b84b';
    ctx.font = pxFont(10);
    ctx.fillText('PRESS A TO START', 240, 280);
  }

  ctx.fillStyle = '#888';
  ctx.font = pxFont(7);
  ctx.fillText('© 2024 FantasyMon Studios', 240, 305);
}

function initBattle(opponentIndex) {
  const op = JSON.parse(JSON.stringify(OPPONENTS[opponentIndex]));
  // Re-attach draw functions to opponent players
  op.team.forEach(p => {
    const template = PLAYERS.find(x=>x.id===p.id);
    p.drawFn = template.drawFn;
    p.colors = template.colors;
  });
  G.opponent = op;
  G.opActive = 0;
  G.activeIdx = 0;
  // Reset HP for player roster
  G.playerRoster.forEach(p => { p.hp = p.maxHp; });
  G.battle = {
    log: [`${op.name}: "${op.greeting}"`, `Go, ${G.playerRoster[0].name}!`],
    logIdx: 0,
    atkStages: [0,0],  // [player, enemy] attack stage modifiers
    defStages: [0,0],
    phase: 'DIALOG',   // DIALOG, MENU, MOVE_EXEC, ENEMY_TURN, FAINTED, WIN, LOSE
    selectedMove: 0,
    turnResult: null,
    switchTarget: -1,
  };
  G.phase = 'DIALOG';
  showDialog(G.battle.log[0]);
}

function getActivePlayer() { return G.playerRoster[G.activeIdx]; }
function getActiveEnemy()  { return G.opponent.team[G.opActive]; }

function stageMultiplier(stage) {
  const s = Math.max(-6, Math.min(6, stage));
  return s >= 0 ? (2+s)/2 : 2/(2-s);
}

function execMove(attacker, defender, moveName, atkStage, defStage) {
  const move = MOVES[moveName];
  if (!move) return { dmg:0, eff:1, miss:false, text:'???' };
  // Accuracy check
  if (Math.random() * 100 > move.acc) return { dmg:0, eff:1, miss:true, text:`${attacker.name} missed!` };
  // Effect moves
  if (move.effect) return { dmg:0, eff:1, miss:false, effect:move.effect, text:applyEffect(move.effect, attacker) };
  // Damage calc
  const eff = getEffectiveness(move.type, defender.type);
  const atkMul = stageMultiplier(atkStage);
  const defMul = stageMultiplier(defStage);
  const base = move.power * (attacker.atk / 100) * atkMul;
  const reduced = base * (100 / (100 + defender.def * defMul));
  const rand = 0.85 + Math.random() * 0.15;
  const dmg = Math.max(1, Math.round(reduced * eff * rand * 0.8));
  let effText = '';
  if (eff >= 2) effText = "It's super effective!";
  else if (eff <= 0.5) effText = "Not very effective...";
  return { dmg, eff, miss:false, text:`${attacker.name} used ${moveName}! ${effText}`.trim() };
}

function applyEffect(effect, attacker) {
  const b = G.battle;
  const isPlayer = attacker === getActivePlayer();
  if (effect === 'atk+2') { b.atkStages[isPlayer?0:1]+=2; return `${attacker.name}'s ATK sharply rose!`; }
  if (effect === 'def+2') { b.defStages[isPlayer?0:1]+=2; return `${attacker.name}'s DEF sharply rose!`; }
  if (effect === 'eatk-2') { b.atkStages[isPlayer?1:0]-=2; return `${attacker.name}'s ATK harshly fell!`; }
  return '';
}

// BATTLE LOGIC
// ============================================================
function battleUpdate() {
  const b = G.battle;
  const player = getActivePlayer();
  const enemy  = getActiveEnemy();

  updateDialog();

  if (b.phase === 'DIALOG') {
    if (G.dialogDone && keyJustPressed.a) {
      b.logIdx++;
      if (b.logIdx < b.log.length) {
        showDialog(b.log[b.logIdx]);
      } else {
        b.phase = 'MENU';
        b.selectedMove = 0;
      }
    }
    return;
  }

  if (b.phase === 'MENU') {
    if (keyJustPressed.up)   b.selectedMove = (b.selectedMove + 2) % 4;
    if (keyJustPressed.down) b.selectedMove = (b.selectedMove + 2) % 4;
    if (keyJustPressed.a) {
      if (b.selectedMove === 0) { b.phase = 'MOVES'; b.selectedMove = 0; }
      if (b.selectedMove === 1) { b.phase = 'ROSTER_SWITCH'; G.rosterCursor = 0; }
      if (b.selectedMove === 2) useDraftPick();
      if (b.selectedMove === 3) tryRun();
    }
    return;
  }

  if (b.phase === 'MOVES') {
    if (keyJustPressed.up)   b.selectedMove = (b.selectedMove + 2) % 4;
    if (keyJustPressed.down) b.selectedMove = (b.selectedMove + 2) % 4;
    if (keyJustPressed.b)    { b.phase = 'MENU'; b.selectedMove = 0; return; }
    if (keyJustPressed.a) {
      const moveName = player.moves[b.selectedMove];
      executePlayerMove(moveName);
    }
    return;
  }

  if (b.phase === 'ROSTER_SWITCH') {
    if (keyJustPressed.up)   G.rosterCursor = Math.max(0, G.rosterCursor-1);
    if (keyJustPressed.down) G.rosterCursor = Math.min(G.playerRoster.length-1, G.rosterCursor+1);
    if (keyJustPressed.b)    { b.phase = 'MENU'; return; }
    if (keyJustPressed.a) {
      const target = G.playerRoster[G.rosterCursor];
      if (G.rosterCursor === G.activeIdx) { showDialog(`${target.name} is already out!`); b.phase='DIALOG'; b.log=[`${target.name} is already out!`]; b.logIdx=0; return; }
      if (target.hp <= 0) { showDialog(`${target.name} has fainted!`); b.phase='DIALOG'; b.log=[`${target.name} has fainted!`]; b.logIdx=0; return; }
      G.activeIdx = G.rosterCursor;
      showDialog(`Go, ${target.name}!`);
      b.log = [`Go, ${target.name}!`];
      b.logIdx = 0;
      b.phase = 'DIALOG';
      // Enemy still attacks after switch
      setTimeout(()=>{ if(b.phase==='MENU') executeEnemyMove(); }, 1500);
    }
    return;
  }

  if (b.phase === 'MOVE_EXEC') {
    if (G.dialogDone && keyJustPressed.a) {
      if (b.pendingEnemy) {
        b.pendingEnemy = false;
        executeEnemyMove();
      } else {
        checkFaints();
      }
    }
    return;
  }

  if (b.phase === 'ENEMY_TURN') {
    if (G.dialogDone && keyJustPressed.a) {
      checkFaints();
    }
    return;
  }

  if (b.phase === 'FAINTED') {
    if (G.dialogDone && keyJustPressed.a) {
      // Check if all player players fainted
      const allFainted = G.playerRoster.every(p=>p.hp<=0);
      if (allFainted) { G.screen = 'LOSE'; return; }
      const allEnemyFainted = G.opponent.team.every(p=>p.hp<=0);
      if (allEnemyFainted) { winBattle(); return; }
      // Must switch
      b.phase = 'ROSTER_SWITCH';
      G.rosterCursor = 0;
    }
    return;
  }

  if (b.phase === 'WIN') {
    if (G.dialogDone && keyJustPressed.a) winBattle();
    return;
  }
}

function executePlayerMove(moveName) {
  const b = G.battle;
  const player = getActivePlayer();
  const enemy  = getActiveEnemy();
  const result = execMove(player, enemy, moveName, b.atkStages[0], b.defStages[1]);
  if (!result.miss && result.dmg > 0) {
    enemy.hp = Math.max(0, enemy.hp - result.dmg);
    G.battleAnim.enemyShake  = 8;
    G.battleAnim.flashEnemy  = 12;
  }
  if (result.dmg > 0) {
    showDialog(`${result.text} (${result.dmg} pts!)`);
  } else {
    showDialog(result.text);
  }
  b.log = [result.text + (result.dmg>0?` (${result.dmg} pts!)`:'')];
  b.logIdx = 0;
  b.phase = 'MOVE_EXEC';
  b.pendingEnemy = enemy.hp > 0; // enemy retaliates if alive
  if (enemy.hp <= 0) b.pendingEnemy = false;
}

function executeEnemyMove() {
  const b = G.battle;
  const player = getActivePlayer();
  const enemy  = getActiveEnemy();
  if (enemy.hp <= 0) { checkFaints(); return; }
  const moveName = enemy.moves[Math.floor(Math.random()*enemy.moves.length)];
  const result = execMove(enemy, player, moveName, b.atkStages[1], b.defStages[0]);
  if (!result.miss && result.dmg > 0) {
    player.hp = Math.max(0, player.hp - result.dmg);
    G.battleAnim.playerShake = 8;
    G.battleAnim.flashPlayer = 12;
  }
  if (result.dmg > 0) {
    showDialog(`${result.text} (${result.dmg} pts!)`);
  } else {
    showDialog(result.text);
  }
  b.log = [result.text + (result.dmg>0?` (${result.dmg} pts!)`:'')];
  b.logIdx = 0;
  b.phase = 'ENEMY_TURN';
}

function checkFaints() {
  const b = G.battle;
  const player = getActivePlayer();
  const enemy  = getActiveEnemy();

  if (enemy.hp <= 0) {
    const allEnemyFainted = G.opponent.team.every(p=>p.hp<=0);
    if (allEnemyFainted) {
      showDialog(`All of ${G.opponent.name}'s players fainted! You win!`);
      b.log = [`All of ${G.opponent.name}'s players fainted! You win!`];
      b.logIdx = 0; b.phase = 'WIN';
      return;
    }
    // Next enemy
    G.opActive++;
    const next = getActiveEnemy();
    showDialog(`${G.opponent.name} sends out ${next.name}!`);
    b.log = [`${G.opponent.name} sends out ${next.name}!`];
    b.logIdx = 0; b.phase = 'DIALOG';
    return;
  }

  if (player.hp <= 0) {
    showDialog(`${player.name} is injured!`);
    b.log = [`${player.name} is injured!`];
    b.logIdx = 0; b.phase = 'FAINTED';
    return;
  }

  b.phase = 'MENU';
  b.selectedMove = 0;
}

function useDraftPick() {
  const b = G.battle;
  if (G.draftPicks <= 0) {
    showDialog("No Draft Picks left!");
    b.log = ["No Draft Picks left!"];
    b.logIdx = 0; b.phase = 'DIALOG'; return;
  }
  // Try to "sign" enemy player (capture)
  const enemy = getActiveEnemy();
  const chance = (1 - enemy.hp/enemy.maxHp) * 0.6 + 0.2;
  G.draftPicks--;
  if (Math.random() < chance && G.playerRoster.length < 6) {
    const caught = JSON.parse(JSON.stringify(enemy));
    caught.drawFn = PLAYERS.find(x=>x.id===enemy.id).drawFn;
    caught.colors = PLAYERS.find(x=>x.id===enemy.id).colors;
    G.playerRoster.push(caught);
    showDialog(`You signed ${enemy.name}! Added to roster!`);
    enemy.hp = 0;
  } else {
    showDialog(`${enemy.name} broke free! (${G.draftPicks} picks left)`);
  }
  b.log = [G.currentText];
  b.logIdx = 0; b.phase = 'DIALOG';
}

function tryRun() {
  const b = G.battle;
  showDialog("You can't run from an official game!");
  b.log = ["You can't run from an official game!"];
  b.logIdx = 0; b.phase = 'DIALOG';
}

function winBattle() {
  G.defeatedOps.push(G.opponentIdx);
  G.score += G.opponent.reward;
  // Level up active player
  G.playerRoster.forEach(p => {
    if (p.hp > 0) { p.level = Math.min(50, p.level+1); p.maxHp = Math.round(p.maxHp*1.05); p.hp = p.maxHp; p.atk = Math.round(p.atk*1.03); }
  });
  if (G.defeatedOps.length >= OPPONENTS.length) {
    G.screen = 'WIN';
  } else {
    G.screen = 'OVERWORLD';
    G.opponentIdx = G.defeatedOps.length;
  }
}

  ctx.font = pxFont(10);
  ctx.fillText('YOU ARE THE FANTASY CHAMPION!', 240, 115);
  ctx.fillStyle = '#e8b84b';
  ctx.font = pxFont(9);
  ctx.fillText(`FINAL SCORE: ${G.score}`, 240, 145);
  ctx.fillStyle = '#aaa';
  ctx.font = pxFont(7);
  ctx.fillText('YOUR ROSTER:', 240, 175);
  G.playerRoster.forEach((p,i) => {
    ctx.fillStyle = TYPES[p.type].color;
    ctx.fillText(`${p.name} (${p.type}) Lv.${p.level}`, 240, 195+i*18);
  });
  if (G.tick%40<22) {
    ctx.fillStyle = '#e8b84b'; ctx.font = pxFont(8);
    ctx.fillText('PRESS A TO PLAY AGAIN', 240, 300);
  }
}

function drawLose() {
  ctx.fillStyle = '#0d0000'; ctx.fillRect(0,0,480,320);
  // Rain effect
  for (let i=0; i<20; i++) {
    ctx.strokeStyle = 'rgba(100,150,255,0.4)';
    ctx.lineWidth = 1;
    const rx = (i*37+G.tick*3)%480, ry = (i*53+G.tick*4)%320;
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-3,ry+20); ctx.stroke();
  }
  ctx.fillStyle = '#ff4444';
  ctx.font = pxFont(22);
  ctx.textAlign = 'center';
  ctx.shadowColor = '#aa0000'; ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', 240, 80);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ccc';
  ctx.font = pxFont(8);
  ctx.fillText('ALL PLAYERS INJURED', 240, 115);
  ctx.fillText(`SCORE: ${G.score}`, 240, 145);
  ctx.fillStyle = '#888'; ctx.font = pxFont(7);
  ctx.fillText(`Defeated: ${G.defeatedOps.length}/${OPPONENTS.length} coaches`, 240, 170);
  if (G.tick%40<22) {
    ctx.fillStyle = '#e8b84b'; ctx.font = pxFont(8);
    ctx.fillText('PRESS A TO TRY AGAIN', 240, 300);
  }
}

// ============================================================
// GAME FLOW / TRANSITIONS
// ============================================================
function startGame() {
  introStep = 0;
  G.screen = 'INTRO';
  showDialog(introTexts[0]);
}

function chooseStarters() {
  // Pick 3 random starters from available QB/RB/WR types
  const pool = PLAYERS.filter(p=>['QB','RB','WR'].includes(p.type));
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  G.starterChoices = shuffled.slice(0,3).map(p=>JSON.parse(JSON.stringify(p)));
  G.starterChoices.forEach(p=>{ p.drawFn = PLAYERS.find(x=>x.id===p.id).drawFn; p.colors = PLAYERS.find(x=>x.id===p.id).colors; });
  G.starterCursor = 0;
  G.screen = 'STARTER';
}

function confirmStarter() {
  const starter = G.starterChoices[G.starterCursor];
  // Build roster of 3: starter + 2 random support picks
  const rest = PLAYERS.filter(p=>p.id!==starter.id && ['RB','WR','TE'].includes(p.type));
  const extras = rest.sort(()=>Math.random()-0.5).slice(0,2).map(p=>JSON.parse(JSON.stringify(p)));
  extras.forEach(p=>{ p.drawFn=PLAYERS.find(x=>x.id===p.id).drawFn; p.colors=PLAYERS.find(x=>x.id===p.id).colors; });
  G.playerRoster = [starter, ...extras];
  G.activeIdx = 0;
  G.defeatedOps = [];
  G.score = 0;
  G.draftPicks = 5;
  G.opponentIdx = 0;
  G.screen = 'OVERWORLD';
}

function resetGame() {
  G.screen = 'TITLE';
  G.tick = 0;
  G.defeatedOps = [];
}

// ============================================================
// MAIN LOOP
// ============================================================
function update() {
  // Detect just-pressed
  for (const k in KEYS) {
    keyJustPressed[k] = KEYS[k] && !lastKeyState[k];
    lastKeyState[k] = KEYS[k];
  }

  G.tick++;

  if (G.screen === 'TITLE') {
    if (keyJustPressed.a) startGame();
  }
  else if (G.screen === 'INTRO') {
    updateDialog();
    if (G.dialogDone && keyJustPressed.a) {
      introStep++;
      if (introStep >= introTexts.length) chooseStarters();
      else showDialog(introTexts[introStep]);
    }
  }
  else if (G.screen === 'STARTER') {
    if (keyJustPressed.up || keyJustPressed.b && false) {}  // intentional no-op
    if (keyJustPressed.a) confirmStarter();
    // Horizontal nav
    if (keyJustPressed.up) G.starterCursor = (G.starterCursor+2)%3;
    if (keyJustPressed.down) G.starterCursor = (G.starterCursor+1)%3;
  }
  else if (G.screen === 'OVERWORLD') {
    if (keyJustPressed.up) G.opponentIdx = Math.max(0, G.opponentIdx-1);
    if (keyJustPressed.down) G.opponentIdx = Math.min(OPPONENTS.length-1, G.opponentIdx+1);
    if (keyJustPressed.a) {
      if (!G.defeatedOps.includes(G.opponentIdx) && G.opponentIdx <= G.defeatedOps.length) {
        initBattle(G.opponentIdx);
        G.screen = 'BATTLE';
      }
    }
  }
  else if (G.screen === 'BATTLE') {
    battleUpdate();
  }
  else if (G.screen === 'WIN') {
    if (keyJustPressed.a) resetGame();
  }
  else if (G.screen === 'LOSE') {
    if (keyJustPressed.a) resetGame();
  }
}

function draw() {
  ctx.clearRect(0, 0, 480, 320);

  if      (G.screen === 'TITLE')     drawTitle();
  else if (G.screen === 'INTRO')     drawIntro();
  else if (G.screen === 'STARTER')   drawStarterSelect();
  else if (G.screen === 'OVERWORLD') drawOverworld();
  else if (G.screen === 'BATTLE')    drawBattle();
  else if (G.screen === 'WIN')       drawWin();
  else if (G.screen === 'LOSE')      drawLose();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// KEYBOARD SHORTCUTS (STAR SELECT HORIZONTAL)
// ============================================================
document.addEventListener('keydown', e => {
  if (G.screen === 'STARTER') {
    if (e.key==='ArrowLeft'||e.key==='a') {
      KEYS.up = true;
      setTimeout(()=>KEYS.up=false,50);
    }
    if (e.key==='ArrowRight'||e.key==='d') {
      KEYS.down = true;
      setTimeout(()=>KEYS.down=false,50);
    }
  }
  if (G.screen === 'OVERWORLD') {
    if (e.key==='ArrowLeft'||e.key==='a') {
      KEYS.up = true;
      setTimeout(()=>KEYS.up=false,50);
    }
    if (e.key==='ArrowRight'||e.key==='d') {
      KEYS.down = true;
      setTimeout(()=>KEYS.down=false,50);
    }
  }
  if (G.screen === 'BATTLE') {
    if (e.key==='ArrowLeft'||e.key==='a') {
      KEYS.up = true;
      setTimeout(()=>KEYS.up=false,50);
    }
    if (e.key==='ArrowRight'||e.key==='d') {
      KEYS.down = true;
      setTimeout(()=>KEYS.down=false,50);
    }
  }
});

// Start
gameLoop();
</script>
