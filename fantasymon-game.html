<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FantasyMon Season Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;}
  body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Press Start 2P',monospace;overflow:hidden;}
  #gameCanvas{border:4px solid #e8b84b;box-shadow:0 0 40px #e8b84b44,0 0 80px #e8b84b22;cursor:pointer;display:block;}
  #ui{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .btn{font-family:'Press Start 2P',monospace;font-size:9px;padding:6px 10px;background:#1a1a3e;color:#e8b84b;border:2px solid #e8b84b;cursor:pointer;transition:all 0.1s;}
  .btn:hover{background:#e8b84b;color:#0a0a1a;}
  .btn:active{transform:scale(0.95);}
  #nameWrap{position:fixed;display:none;flex-direction:column;align-items:center;gap:8px;z-index:200;}
  #nameInput{font-family:'Press Start 2P',monospace;font-size:13px;background:#0d0d2b;color:#e8b84b;border:3px solid #e8b84b;padding:10px 14px;text-align:center;width:240px;outline:none;}
  #nameConfirm{font-family:'Press Start 2P',monospace;font-size:10px;padding:8px 16px;background:#0d0d2b;color:#e8b84b;border:2px solid #44dd44;cursor:pointer;}
  #nameConfirm:hover{background:#44dd44;color:#0a0a1a;}
</style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<canvas id="gameCanvas" width="480" height="320"></canvas>
<div id="ui">
  <button class="btn" id="btnA">A / CONFIRM</button>
  <button class="btn" id="btnB">B / BACK</button>
  <button class="btn" id="btnUp">▲</button>
  <button class="btn" id="btnDown">▼</button>
  <button class="btn" id="btnSave">SAVE</button>
  <button class="btn" id="btnLoad">LOAD</button>
</div>
<div id="nameWrap">
  <input id="nameInput" type="text" maxlength="12" placeholder="Coach name..." autocomplete="off" spellcheck="false"/>
  <button id="nameConfirm">CONFIRM</button>
</div>
<script>
// ═══════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ═══════════════════════════════════════════════
// TYPES & EFFECTIVENESS
// ═══════════════════════════════════════════════
const TYPES = {
  QB: {name:'QB', color:'#FF6B35', dark:'#cc4400'},
  RB: {name:'RB', color:'#8B4513', dark:'#5a2d0c'},
  WR: {name:'WR', color:'#4169E1', dark:'#1a3fa0'},
  TE: {name:'TE', color:'#228B22', dark:'#145214'},
  DEF:{name:'DEF',color:'#808080', dark:'#4d4d4d'},
  K:  {name:'K',  color:'#9932CC', dark:'#5c1e7a'}
};
const TYPE_CHART = {
  QB: {strong:['DEF','K'],  weak:['WR','RB']},
  RB: {strong:['QB','TE'],  weak:['DEF','WR']},
  WR: {strong:['RB','DEF'], weak:['TE','QB']},
  TE: {strong:['WR','QB'],  weak:['RB','K']},
  DEF:{strong:['TE','RB'],  weak:['QB','K']},
  K:  {strong:['WR','DEF'], weak:['QB','TE']}
};
function getEff(a,d){const c=TYPE_CHART[a];if(!c)return 1;if(c.strong.includes(d))return 2;if(c.weak.includes(d))return 0.5;return 1;}

// ═══════════════════════════════════════════════
// WEATHER
// ═══════════════════════════════════════════════
const WEATHERS={
  CLEAR:{name:'CLEAR', color:'#87CEEB', icon:'☀',  mods:{}},
  RAIN: {name:'RAIN',  color:'#4a6fa5', icon:'🌧', mods:{QB_acc:-15,K_pow:-20,RB_pow:10}},
  WIND: {name:'WIND',  color:'#a0a0a0', icon:'💨', mods:{K_acc:-25,K_pow:-20,DEEP_acc:-15}},
  SNOW: {name:'SNOW',  color:'#b0c8e8', icon:'❄',  mods:{all_acc:-10,DEF_pow:10}},
  DOME: {name:'DOME',  color:'#c8a0e0', icon:'🏟', mods:{}},
  HEAT: {name:'HEAT',  color:'#e8a020', icon:'🔥', mods:{RB_pow:15,QB_acc:5}}
};
let currentWeather='CLEAR';
function pickWeather(forced){currentWeather=forced||Object.keys(WEATHERS)[Math.floor(Math.random()*6)];}
function wAccMod(mtype,mname){const w=WEATHERS[currentWeather].mods;let m=0;if(w.all_acc)m+=w.all_acc;if(mtype==='K'&&w.K_acc)m+=w.K_acc;if(mname==='DEEP BALL'&&w.DEEP_acc)m+=w.DEEP_acc;return m;}
function wPowMod(mtype){const w=WEATHERS[currentWeather].mods;let m=0;if(mtype==='K'&&w.K_pow)m+=w.K_pow;if(mtype==='RB'&&w.RB_pow)m+=w.RB_pow;if(mtype==='DEF'&&w.DEF_pow)m+=w.DEF_pow;return m;}

// ═══════════════════════════════════════════════
// SPRITE HELPERS
// ═══════════════════════════════════════════════
function pr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function shade(hex,amt){const n=parseInt((hex||'#888').replace('#',''),16)||0x888888;const r=Math.min(255,Math.max(0,(n>>16)+amt));const g=Math.min(255,Math.max(0,((n>>8)&0xff)+amt));const b=Math.min(255,Math.max(0,(n&0xff)+amt));return`rgb(${r},${g},${b})`;}
function jerseyGrad(col,cx,cy,h){const g=ctx.createLinearGradient(cx,cy,cx,cy+h);g.addColorStop(0,shade(col,45));g.addColorStop(0.35,col);g.addColorStop(1,shade(col,-35));return g;}
function helmGrad(col,cx,cy,r,ev){const c=ev?'#FFD700':col;const g=ctx.createRadialGradient(cx-r*.3,cy-r*.25,r*.08,cx,cy,r);g.addColorStop(0,shade(c,55));g.addColorStop(0.55,c);g.addColorStop(1,shade(c,-30));return g;}
function drawBall(cx,cy,s,angle){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(angle||0);
  const bg=ctx.createRadialGradient(-2*s,-1*s,1*s,0,0,8*s);bg.addColorStop(0,'#a0522d');bg.addColorStop(1,'#5c2a0d');
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,8*s,5*s,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#3a1a08';ctx.lineWidth=0.8*s;ctx.beginPath();ctx.ellipse(0,0,8*s,5*s,0,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=1*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-6*s,0);ctx.lineTo(6*s,0);ctx.stroke();
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*2.5*s,-2.5*s);ctx.lineTo(i*2.5*s,2.5*s);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.ellipse(-3*s,-1.5*s,3*s,1.5*s,-.4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawHelmet(cx,cy,s,c,ev){
  if(ev){ctx.shadowColor='#FFD700';ctx.shadowBlur=14;}
  ctx.fillStyle=helmGrad(c.helmet,cx,cy+5*s,14*s,ev);
  ctx.beginPath();ctx.arc(cx,cy+5*s,14*s,0,Math.PI*2);ctx.fill();
  // Stripe down middle
  const stripe=c.num_c||'#fff';
  ctx.fillStyle=stripe;ctx.fillRect(cx-2.5*s,cy-9*s,5*s,17*s);
  ctx.strokeStyle=shade(c.helmet,-45);ctx.lineWidth=1*s;ctx.beginPath();ctx.arc(cx,cy+5*s,13.5*s,0.4,Math.PI-.4);ctx.stroke();
  // Visor dark area
  ctx.fillStyle='rgba(0,0,0,0.38)';ctx.beginPath();ctx.arc(cx,cy+9*s,10.5*s,-0.55,Math.PI+0.55);ctx.fill();
  // Facemask cage
  ctx.strokeStyle=c.mask;ctx.lineWidth=2.2*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-8*s,cy+10*s);ctx.bezierCurveTo(cx-9*s,cy+14*s,cx-9*s,cy+18*s,cx-5*s,cy+20*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+8*s,cy+10*s);ctx.bezierCurveTo(cx+9*s,cy+14*s,cx+9*s,cy+18*s,cx+5*s,cy+20*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-8*s,cy+13*s);ctx.lineTo(cx+8*s,cy+13*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-7*s,cy+17*s);ctx.lineTo(cx+7*s,cy+17*s);ctx.stroke();
  // Highlight
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.beginPath();ctx.ellipse(cx-5*s,cy-1*s,4.5*s,2.5*s,-.5,0,Math.PI*2);ctx.fill();
  if(ev)ctx.shadowBlur=0;
}
function drawCleats(cx,cy,s,offset=0){
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath();ctx.ellipse(cx-10*s,cy+offset,9*s,4.5*s,-.15,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+8*s,cy+offset,9*s,4.5*s,.15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';
  for(let i=-1;i<=1;i++){ctx.fillRect(cx-13*s+i*3.5*s,cy+offset-1,2*s,5*s);}
  for(let i=-1;i<=1;i++){ctx.fillRect(cx+5*s+i*3.5*s,cy+offset-1,2*s,5*s);}
}

function drawQB(cx,cy,s,c,ev){
  ctx.save();
  // Ground shadow
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(cx,cy+56*s,17*s,4*s,0,0,Math.PI*2);ctx.fill();
  drawCleats(cx,cy+54*s,s);
  // Pants with gradient + stripe
  const pg=ctx.createLinearGradient(cx-14*s,0,cx+14*s,0);pg.addColorStop(0,shade(c.pants,-25));pg.addColorStop(.5,c.pants);pg.addColorStop(1,shade(c.pants,-25));
  ctx.fillStyle=pg;ctx.fillRect(cx-14*s,cy+34*s,12*s,20*s);ctx.fillRect(cx+2*s,cy+36*s,12*s,18*s);
  ctx.fillStyle=c.num_c||'#fff';ctx.fillRect(cx-9*s,cy+34*s,2.5*s,20*s);ctx.fillRect(cx+7*s,cy+36*s,2.5*s,18*s);
  // Jersey body — shoulder pads shape
  ctx.fillStyle=jerseyGrad(c.jersey,cx,cy+14*s,26*s);
  ctx.beginPath();ctx.moveTo(cx-19*s,cy+22*s);ctx.lineTo(cx-14*s,cy+14*s);ctx.lineTo(cx+14*s,cy+14*s);ctx.lineTo(cx+19*s,cy+22*s);ctx.lineTo(cx+15*s,cy+40*s);ctx.lineTo(cx-15*s,cy+40*s);ctx.closePath();ctx.fill();
  // Shoulder pad highlight line
  ctx.strokeStyle=shade(c.jersey,40);ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(cx-19*s,cy+22*s);ctx.lineTo(cx-13*s,cy+24*s);ctx.moveTo(cx+19*s,cy+22*s);ctx.lineTo(cx+13*s,cy+24*s);ctx.stroke();
  // Number
  ctx.fillStyle=c.num_c;ctx.font=`bold ${10*s}px Impact,Arial Black,sans-serif`;ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=3*s;ctx.fillText(c.num,cx,cy+34*s);ctx.shadowBlur=0;
  // Left arm down
  ctx.fillStyle=jerseyGrad(c.jersey,cx-22*s,cy+18*s,15*s);ctx.fillRect(cx-23*s,cy+18*s,9*s,15*s);
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.ellipse(cx-19*s,cy+35*s,5*s,4*s,.2,0,Math.PI*2);ctx.fill();
  // Right arm raised — throwing
  ctx.fillStyle=jerseyGrad(c.jersey,cx+14*s,cy+6*s,18*s);ctx.fillRect(cx+14*s,cy+6*s,9*s,16*s);
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.ellipse(cx+19*s,cy+4*s,5*s,4*s,-.1,0,Math.PI*2);ctx.fill();
  // Neck
  ctx.fillStyle=c.skin;ctx.fillRect(cx-4*s,cy+12*s,8*s,4*s);
  // Football
  drawBall(cx+27*s,cy+1*s,s,-.4);
  // Helmet
  drawHelmet(cx,cy,s,c,ev);
  ctx.restore();
}

function drawRB(cx,cy,s,c,ev){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(cx,cy+56*s,18*s,4*s,0,0,Math.PI*2);ctx.fill();
  drawCleats(cx,cy+54*s,s);
  // Pants — running legs offset
  const pg=ctx.createLinearGradient(cx-16*s,0,cx+16*s,0);pg.addColorStop(0,shade(c.pants,-25));pg.addColorStop(.5,c.pants);pg.addColorStop(1,shade(c.pants,-25));
  ctx.fillStyle=pg;ctx.fillRect(cx-13*s,cy+34*s,12*s,22*s);ctx.fillRect(cx+3*s,cy+38*s,12*s,18*s);
  ctx.fillStyle=c.num_c||'#fff';ctx.fillRect(cx-8*s,cy+34*s,2.5*s,22*s);ctx.fillRect(cx+8*s,cy+38*s,2.5*s,18*s);
  // Stocky jersey
  ctx.fillStyle=jerseyGrad(c.jersey,cx,cy+14*s,28*s);
  ctx.beginPath();ctx.moveTo(cx-21*s,cy+23*s);ctx.lineTo(cx-16*s,cy+14*s);ctx.lineTo(cx+16*s,cy+14*s);ctx.lineTo(cx+21*s,cy+23*s);ctx.lineTo(cx+17*s,cy+42*s);ctx.lineTo(cx-17*s,cy+42*s);ctx.closePath();ctx.fill();
  ctx.strokeStyle=shade(c.jersey,40);ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(cx-21*s,cy+23*s);ctx.lineTo(cx-15*s,cy+25*s);ctx.moveTo(cx+21*s,cy+23*s);ctx.lineTo(cx+15*s,cy+25*s);ctx.stroke();
  ctx.fillStyle=c.num_c;ctx.font=`bold ${10*s}px Impact,Arial Black,sans-serif`;ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=3*s;ctx.fillText(c.num,cx,cy+34*s);ctx.shadowBlur=0;
  // Left arm — tucking ball
  ctx.fillStyle=jerseyGrad(c.jersey,cx-25*s,cy+20*s,14*s);ctx.fillRect(cx-25*s,cy+20*s,9*s,14*s);
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.ellipse(cx-21*s,cy+36*s,5*s,4*s,.3,0,Math.PI*2);ctx.fill();
  drawBall(cx-21*s,cy+28*s,s,.4);
  // Right arm back
  ctx.fillStyle=jerseyGrad(c.jersey,cx+16*s,cy+22*s,12*s);ctx.fillRect(cx+16*s,cy+22*s,9*s,12*s);
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.ellipse(cx+21*s,cy+36*s,5*s,4*s,-.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c.skin;ctx.fillRect(cx-4*s,cy+12*s,8*s,4*s);
  drawHelmet(cx,cy-2*s,s,c,ev);
  ctx.restore();
}

function drawWR(cx,cy,s,c,ev){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(cx,cy+58*s,13*s,3.5*s,0,0,Math.PI*2);ctx.fill();
  drawCleats(cx,cy+54*s,s);
  // Slim jumping legs
  const pg=ctx.createLinearGradient(cx-12*s,0,cx+12*s,0);pg.addColorStop(0,shade(c.pants,-25));pg.addColorStop(.5,c.pants);pg.addColorStop(1,shade(c.pants,-25));
  ctx.fillStyle=pg;ctx.fillRect(cx-11*s,cy+36*s,10*s,20*s);ctx.fillRect(cx+3*s,cy+32*s,10*s,16*s);ctx.fillRect(cx+3*s,cy+44*s,10*s,12*s);
  ctx.fillStyle=c.num_c||'#fff';ctx.fillRect(cx-7*s,cy+36*s,2*s,20*s);ctx.fillRect(cx+7*s,cy+32*s,2*s,24*s);
  // Slim jersey
  ctx.fillStyle=jerseyGrad(c.jersey,cx,cy+12*s,26*s);
  ctx.beginPath();ctx.moveTo(cx-16*s,cy+20*s);ctx.lineTo(cx-12*s,cy+12*s);ctx.lineTo(cx+12*s,cy+12*s);ctx.lineTo(cx+16*s,cy+20*s);ctx.lineTo(cx+13*s,cy+38*s);ctx.lineTo(cx-13*s,cy+38*s);ctx.closePath();ctx.fill();
  ctx.strokeStyle=shade(c.jersey,40);ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(cx-16*s,cy+20*s);ctx.lineTo(cx-11*s,cy+22*s);ctx.moveTo(cx+16*s,cy+20*s);ctx.lineTo(cx+11*s,cy+22*s);ctx.stroke();
  ctx.fillStyle=c.num_c;ctx.font=`bold ${9*s}px Impact,Arial Black,sans-serif`;ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=3*s;ctx.fillText(c.num,cx,cy+30*s);ctx.shadowBlur=0;
  // Both arms raised to catch
  ctx.fillStyle=jerseyGrad(c.jersey,cx-21*s,cy+6*s,16*s);ctx.fillRect(cx-22*s,cy+6*s,8*s,16*s);
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.ellipse(cx-18*s,cy+4*s,5*s,4*s,-.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=jerseyGrad(c.jersey,cx+14*s,cy+4*s,16*s);ctx.fillRect(cx+14*s,cy+4*s,8*s,16*s);
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.ellipse(cx+18*s,cy+2*s,5*s,4*s,.1,0,Math.PI*2);ctx.fill();
  // Ball above hands
  drawBall(cx,cy-2*s,s,0);
  ctx.fillStyle=c.skin;ctx.fillRect(cx-4*s,cy+10*s,8*s,4*s);
  drawHelmet(cx,cy+3*s,s,c,ev);
  ctx.restore();
}

function drawTE(cx,cy,s,c,ev){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(cx,cy+56*s,20*s,5*s,0,0,Math.PI*2);ctx.fill();
  drawCleats(cx,cy+54*s,s);
  // Big pants
  const pg=ctx.createLinearGradient(cx-18*s,0,cx+18*s,0);pg.addColorStop(0,shade(c.pants,-25));pg.addColorStop(.5,c.pants);pg.addColorStop(1,shade(c.pants,-25));
  ctx.fillStyle=pg;ctx.fillRect(cx-17*s,cy+32*s,15*s,24*s);ctx.fillRect(cx+2*s,cy+32*s,15*s,24*s);
  ctx.fillStyle=c.num_c||'#fff';ctx.fillRect(cx-12*s,cy+32*s,2.5*s,24*s);ctx.fillRect(cx+10*s,cy+32*s,2.5*s,24*s);
  // Big jersey
  ctx.fillStyle=jerseyGrad(c.jersey,cx,cy+12*s,28*s);
  ctx.beginPath();ctx.moveTo(cx-24*s,cy+22*s);ctx.lineTo(cx-18*s,cy+12*s);ctx.lineTo(cx+18*s,cy+12*s);ctx.lineTo(cx+24*s,cy+22*s);ctx.lineTo(cx+20*s,cy+40*s);ctx.lineTo(cx-20*s,cy+40*s);ctx.closePath();ctx.fill();
  ctx.strokeStyle=shade(c.jersey,40);ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(cx-24*s,cy+22*s);ctx.lineTo(cx-17*s,cy+25*s);ctx.moveTo(cx+24*s,cy+22*s);ctx.lineTo(cx+17*s,cy+25*s);ctx.stroke();
  ctx.fillStyle=c.num_c;ctx.font=`bold ${11*s}px Impact,Arial Black,sans-serif`;ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=3*s;ctx.fillText(c.num,cx,cy+33*s);ctx.shadowBlur=0;
  // Arms spread wide — blocking
  ctx.fillStyle=jerseyGrad(c.jersey,cx-31*s,cy+14*s,16*s);ctx.fillRect(cx-32*s,cy+14*s,10*s,16*s);
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.ellipse(cx-27*s,cy+32*s,6*s,5*s,.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=jerseyGrad(c.jersey,cx+22*s,cy+14*s,16*s);ctx.fillRect(cx+22*s,cy+14*s,10*s,16*s);
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.ellipse(cx+27*s,cy+32*s,6*s,5*s,-.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c.skin;ctx.fillRect(cx-4*s,cy+10*s,8*s,4*s);
  drawHelmet(cx,cy-2*s,s,c,ev);
  ctx.restore();
}

function drawDEF(cx,cy,s,c,ev){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(cx,cy+56*s,20*s,5*s,0,0,Math.PI*2);ctx.fill();
  drawCleats(cx,cy+54*s,s);
  // Low-stance pants
  const pg=ctx.createLinearGradient(cx-16*s,0,cx+16*s,0);pg.addColorStop(0,shade(c.pants,-25));pg.addColorStop(.5,c.pants);pg.addColorStop(1,shade(c.pants,-25));
  ctx.fillStyle=pg;ctx.fillRect(cx-16*s,cy+30*s,14*s,26*s);ctx.fillRect(cx+2*s,cy+30*s,14*s,26*s);
  ctx.fillStyle=c.num_c||'#fff';ctx.fillRect(cx-11*s,cy+30*s,2.5*s,26*s);ctx.fillRect(cx+9*s,cy+30*s,2.5*s,26*s);
  // Big jersey — low crouch
  ctx.fillStyle=jerseyGrad(c.jersey,cx,cy+16*s,22*s);

// ANIMATION SYSTEM
// ═══════════════════════════════════════════════
let AN={active:false,type:'',prog:0,dur:48,fx:0,fy:0,tx:0,ty:0,color:'#fff',cb:null};
let PARTS=[];
function lerp(a,b,t){return a+(b-a)*t;}
function startAnim(type,fx,fy,tx,ty,color,cb){
  AN={active:true,type,prog:0,dur:48,fx,fy,tx,ty,color,cb};
  PARTS=[];
  if(type==='CRASH')for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*4;PARTS.push({x:tx,y:ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:25,ml:25,sz:3+Math.random()*5});}
  if(type==='STARS')for(let i=0;i<10;i++)PARTS.push({x:tx+(Math.random()-.5)*40,y:ty+(Math.random()-.5)*40,vx:(Math.random()-.5)*3,vy:-2-Math.random()*3,life:28,ml:28});
  if(type==='SPEED')for(let i=0;i<8;i++)PARTS.push({x:fx,y:fy+(-3+i)*14,len:20+i*15,life:48,ml:48});
}
function tickAnim(){
  if(!AN.active)return;
  AN.prog++;
  PARTS.forEach(p=>{p.x+=p.vx||0;p.y+=p.vy||0;p.life--;});
  PARTS=PARTS.filter(p=>p.life>0);
  if(AN.prog>=AN.dur){AN.active=false;if(AN.cb)AN.cb();}
}
function drawAnim(){
  if(!AN.active)return;
  const t=AN.prog/AN.dur;
  ctx.save();
  if(AN.type==='SPIRAL'){
    const x=lerp(AN.fx,AN.tx,t),y=lerp(AN.fy,AN.ty,t)-Math.sin(t*Math.PI)*50;
    ctx.translate(x,y);ctx.rotate(t*Math.PI*5);
    ctx.fillStyle='#8B4513';ctx.beginPath();ctx.ellipse(0,0,10,7,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.stroke();
    for(let i=1;i<=4;i++){const tt=Math.max(0,t-i*.04),tx2=lerp(AN.fx,AN.tx,tt),ty2=lerp(AN.fy,AN.ty,tt)-Math.sin(tt*Math.PI)*50;ctx.restore();ctx.save();ctx.globalAlpha=(1-i/5)*.4;ctx.fillStyle='#8B4513';ctx.beginPath();ctx.arc(tx2,ty2,4-i*.5,0,Math.PI*2);ctx.fill();}
  }
  else if(AN.type==='RUSH'){
    ctx.globalAlpha=1-t;
    for(let i=0;i<6;i++){const dx=lerp(AN.fx,AN.tx,t)-30+i*12,dy=AN.fy+10+i*8;ctx.strokeStyle=AN.color;ctx.lineWidth=3-i*.3;ctx.beginPath();ctx.moveTo(dx,dy);ctx.lineTo(dx+25+i*5,dy+2);ctx.stroke();}
    for(let i=0;i<4;i++){ctx.fillStyle='rgba(180,140,80,.35)';ctx.beginPath();ctx.arc(lerp(AN.fx,AN.tx,t)+i*15-20,AN.fy+35,8+i*3,0,Math.PI*2);ctx.fill();}
  }
  else if(AN.type==='SPEED'){
    PARTS.forEach(p=>{const tt=1-p.life/p.ml;ctx.globalAlpha=p.life/p.ml;ctx.strokeStyle=AN.color||'#ffff44';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lerp(AN.fx,AN.tx,tt),p.y);ctx.lineTo(lerp(AN.fx,AN.tx,tt)+p.len*(1-tt),p.y);ctx.stroke();});
    if(t>.7){ctx.globalAlpha=(t-.7)*3;ctx.fillStyle=AN.color||'#ffff44';ctx.beginPath();ctx.arc(AN.tx,AN.ty,20*(1-(t-.7)*3),0,Math.PI*2);ctx.fill();}
  }
  else if(AN.type==='CRASH'){
    PARTS.forEach(p=>{ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=AN.color||'#ff8800';ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(p.life/p.ml),0,Math.PI*2);ctx.fill();});
    if(t<.4){ctx.globalAlpha=1-t*2.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(AN.tx,AN.ty,30*(1-t),0,Math.PI*2);ctx.fill();}
    if(t>.1&&t<.5){ctx.globalAlpha=Math.min(1,(0.5-t)*4);ctx.fillStyle='#FFD700';ctx.font="bold 18px 'Press Start 2P',monospace";ctx.textAlign='center';ctx.fillText('CRUNCH!',AN.tx,AN.ty-20);}
  }
  else if(AN.type==='STARS'){
    PARTS.forEach(p=>{ctx.globalAlpha=p.life/p.ml;ctx.fillStyle='#FFD700';ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('★',p.x,p.y);});
  }
  else if(AN.type==='SHIELD'){
    const r=30+t*10;ctx.globalAlpha=1-t;ctx.strokeStyle='#44aaff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(AN.fx,AN.fy,r,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=(1-t)*.3;ctx.fillStyle='#44aaff';ctx.beginPath();ctx.arc(AN.fx,AN.fy,r,0,Math.PI*2);ctx.fill();
  }
  else if(AN.type==='KICK'){
    const x=lerp(AN.fx,AN.tx,t),y=lerp(AN.fy,AN.ty,t)-Math.sin(t*Math.PI)*80;
    ctx.fillStyle='#8B4513';ctx.beginPath();ctx.ellipse(x,y,8,6,t*3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.stroke();
    if(t>.8){ctx.globalAlpha=(t-.8)*5;ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(AN.tx-15,AN.ty-40);ctx.lineTo(AN.tx-15,AN.ty+10);ctx.stroke();ctx.beginPath();ctx.moveTo(AN.tx+15,AN.ty-40);ctx.lineTo(AN.tx+15,AN.ty+10);ctx.stroke();ctx.beginPath();ctx.moveTo(AN.tx-15,AN.ty-40);ctx.lineTo(AN.tx+15,AN.ty-40);ctx.stroke();}
  }
  else if(AN.type==='EFFECT'){
    for(let i=0;i<3;i++){const rt=(t+i/3)%1;ctx.globalAlpha=(1-rt)*.7;ctx.strokeStyle=AN.color||'#FFD700';ctx.lineWidth=3;ctx.beginPath();ctx.arc(AN.fx,AN.fy,10+rt*40,0,Math.PI*2);ctx.stroke();}
  }
  ctx.restore();
}

const STATUS_INFO={
  INJURED:  {label:'INJRD',color:'#ff4444'},
  CONCUSSED:{label:'CNCSD',color:'#ffaa00'},
  BENCHED:  {label:'BENCH',color:'#4488ff'},
};
function applyStatus(p,st){if(p.status)return false;p.status=st;p.statusTurns=st==='BENCHED'?1+Math.floor(Math.random()*2):0;return true;}
function checkStatus(p){
  if(!p.status)return{skip:false,selfHit:false};
  if(p.status==='INJURED'&&Math.random()<.25)return{skip:true,msg:`${p.name} is injured and can't move!`};
  if(p.status==='CONCUSSED'&&Math.random()<.33)return{selfHit:true,msg:`${p.name} is dazed — might hurt themselves!`};
  if(p.status==='BENCHED'){p.statusTurns--;if(p.statusTurns<=0)p.status=null;else return{skip:true,msg:`${p.name} is BENCHED! (${p.statusTurns} turns left)`};}
  return{skip:false,selfHit:false};
}
function tickStatus(p){
  if(!p.status)return null;
  if(p.status==='INJURED'&&Math.random()<.2){p.status=null;return`${p.name} recovered from injury!`;}
  if(p.status==='CONCUSSED'&&Math.random()<.15){p.status=null;return`${p.name} cleared concussion protocol!`;}
  return null;
}

function loadGame(){
  const raw=localStorage.getItem('fmon_s1');
  if(!raw)return false;
  try{
    const d=JSON.parse(raw);
    G.coachName=d.coachName||'COACH'; G.teamId=d.teamId||'chiefs';
    G.roster=d.roster.map(s=>{const p=mkPlayer(s.id);Object.assign(p,s);p.col=BASE_PLAYERS.find(x=>x.id===s.id).col;p.drawBase=BASE_PLAYERS.find(x=>x.id===s.id).drawBase;p.draw=(cx,cy,sc)=>p.drawBase(cx,cy,sc,p.col,p.evolved);return p;});
    G.ir=(d.ir||[]).map(id=>mkPlayer(id));
    G.freeAgents=(d.freeAgents||[]).map(id=>mkPlayer(id));
    G.draftPicks=d.draftPicks||5; G.score=d.score||0; G.activeIdx=d.activeIdx||0;
    G.season={...d.season};
    // Rebuild opponent rosters for remaining games
    G.season.schedule.forEach(w=>{if(w.type==='GAME'&&!w.result)w.opponentRoster=buildOpponentRoster(NFL_TEAMS.find(t=>t.id===w.opponentId)||NFL_TEAMS[0],w.difficulty);});
    G.screen='SEASON_HUB';
    return true;
  }catch(e){console.error(e);return false;}
}

// SEASON / SCHEDULE SYSTEM
// ═══════════════════════════════════════════════
function buildOpponentRoster(team,diff){
  const pool=[...BASE_PLAYERS].sort(()=>Math.random()-.5).slice(0,3);
  return pool.map(b=>{
    const p=mkPlayer(b.id);
    const sc=0.65+diff*0.12;
    p.maxHp=p.hp=Math.round(p.maxHp*sc);
    p.atk=Math.round(p.atk*sc); p.def=Math.round(p.def*sc);
    p.lvl=4+diff*3+(Math.random()>0.5?1:0);
    return p;
  });
}

const WEEK_EVENTS=['NONE','NONE','NONE','TRAINING','TRAINING','SCOUT','INJURY_SCARE','FREE_AGENT','TRADE_OFFER','NONE'];
function randEvent(){return WEEK_EVENTS[Math.floor(Math.random()*WEEK_EVENTS.length)];}

function generateSchedule(teamId){
  const others=NFL_TEAMS.filter(t=>t.id!==teamId).sort(()=>Math.random()-.5);
  const weeks=[];
  for(let w=1;w<=16;w++){
    if(w===9){weeks.push({week:w,type:'BYE',result:null,isHome:false,event:'BYE'});continue;}
    const idx=w<9?w-1:w-2;
    const opp=others[idx%others.length];
    const diff=w<=4?1:w<=9?2:w<=13?2+(Math.random()>.5?1:0):3;
    weeks.push({
      week:w,type:'GAME',opponentId:opp.id,opponentName:opp.name,opponentAbbr:opp.abbr,
      oppC1:opp.c1,oppC2:opp.c2,oppWeather:opp.weather,
      difficulty:diff,result:null,isHome:w%2===1,
      event:randEvent(),
      opponentRoster:buildOpponentRoster(opp,diff),
    });
  }
  return weeks;
}

function currentWeekData(){return G.season.schedule[G.season.week-1];}
function wins(){return G.season.schedule.filter(w=>w.result==='W').length;}
function losses(){return G.season.schedule.filter(w=>w.result==='L').length;}

function pf(sz){return `${sz}px 'Press Start 2P',monospace`;}
function fillRR(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();ctx.fill();}
function strokeRR(x,y,w,h,r,c,lw=2){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();ctx.stroke();}
function hpBar(x,y,w,h,cur,max){
  const pct=Math.max(0,cur/max);
  fillRR(x,y,w,h,3,'#111');
  strokeRR(x,y,w,h,3,'#444',1);
  if(pct>0){
    const fw=Math.floor((w-2)*pct);
    const col=pct>.5?'#22cc44':pct>.25?'#ddaa00':'#dd2222';
    const g=ctx.createLinearGradient(x+1,y+1,x+1,y+h-1);
    g.addColorStop(0,shade(col,40));g.addColorStop(.5,col);g.addColorStop(1,shade(col,-20));
    fillRR(x+1,y+1,fw,h-2,2,col);
    ctx.fillStyle=g;fillRR(x+1,y+1,fw,h-2,2,col);
    // Shine
    ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x+2,y+1,fw-2,Math.ceil(h/3));
  }
}
function typeTag(type,x,y){
  const t=TYPES[type];
  const g=ctx.createLinearGradient(x,y,x,y+14);g.addColorStop(0,shade(t.color,30));g.addColorStop(1,shade(t.color,-20));
  fillRR(x,y,38,14,4,t.color);ctx.fillStyle=g;fillRR(x,y,38,14,4,shade(t.color,0));
  ctx.strokeStyle=shade(t.color,40);ctx.lineWidth=1;strokeRR(x,y,38,14,4,shade(t.color,40),1);
  ctx.fillStyle='#fff';ctx.font=`bold ${6}px Impact,Arial Black,sans-serif`;ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=3;ctx.fillText(type,x+19,y+10);ctx.shadowBlur=0;
}
function statusTag(st,x,y){
  if(!st)return;const s=STATUS_INFO[st];fillRR(x,y,36,13,4,s.color);
  ctx.fillStyle='#fff';ctx.font=pf(5);ctx.textAlign='center';ctx.fillText(s.label,x+18,y+9);
}
function teamBadge(team,x,y,w=60,h=30){
  fillRR(x,y,w,h,6,team.c1);
  ctx.fillStyle=team.c2;ctx.font=pf(9);ctx.textAlign='center';ctx.fillText(team.abbr,x+w/2,y+h/2+4);
  strokeRR(x,y,w,h,6,team.c2,2);
}
function wrap(txt,maxPx,fontSize){
  ctx.font=pf(fontSize||8);
  const words=txt.split(' ');const lines=[];let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxPx){if(line)lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);return lines;
}

  // Schedule list — show 5 weeks around current
  const sched=G.season.schedule;
  const curIdx=G.season.week-1;
  const start=Math.max(0,Math.min(curIdx-2,sched.length-5));
  for(let i=0;i<5;i++){

    if(w.type==='BYE'){
      ctx.fillStyle='#44dd44';ctx.font=pf(8);ctx.textAlign='center';ctx.fillText('BYE WEEK — REST & HEAL',240,y+26);
    } else {
      // Team badge
      const oT=NFL_TEAMS.find(t=>t.id===w.opponentId)||{c1:'#333',c2:'#aaa',abbr:'???'};
      fillRR(58,y+6,48,30,4,oT.c1);ctx.fillStyle=oT.c2;ctx.font=pf(8);ctx.textAlign='center';ctx.fillText(oT.abbr,82,y+25);

  // Actions bar
  fillRR(0,284,480,36,0,'#0a0a18');strokeRR(0,284,480,36,0,'#333',1);
  const actions=[];
  const cw2=currentWeekData();

  actions.push({label:'TRAIN',key:'train'});
  if(G.ir.length>0)actions.push({label:'FREE AGENCY',key:'fa'});
  actions.push({label:'TRADE',key:'trade'});
  actions.forEach((a,i)=>{
    const ax=8+i*118,sel=G.cursor===i;

    ctx.fillText(a.label,ax+56,302);

    ctx.globalAlpha=1;G.notifTimer--;
  }
}

function getAP(){return G.roster[G.activeIdx];}
function getAE(){return G.opponent&&G.opponent.roster[G.opActiveIdx];}

function drawBattle(){
  const player=getAP(),enemy=getAE();if(!player||!enemy)return;
  const b=G.battle;
  // Sky
  const sg=ctx.createLinearGradient(0,0,0,155);sg.addColorStop(0,'#1a1a3e');sg.addColorStop(1,'#2a3a6e');
  ctx.fillStyle=sg;ctx.fillRect(0,0,480,155);
  // Crowd
  for(let i=0;i<22;i++){ctx.fillStyle=['#E31837','#00338D','#4F2683','#228B22','#FFB612'][i%5];ctx.beginPath();ctx.arc(i*22+11,22,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bbb';ctx.fillRect(i*22+5,26,12,12);}
  // Stadium lights
  [[40,5],[440,5]].forEach(([lx,ly])=>{const lg=ctx.createRadialGradient(lx,ly,2,lx,ly,55);lg.addColorStop(0,'rgba(255,255,200,.5)');lg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=lg;ctx.fillRect(lx-55,ly,110,70);});
  // Field
  const fg=ctx.createLinearGradient(0,138,0,238);fg.addColorStop(0,'#1a5e1a');fg.addColorStop(1,'#0d3d0d');

// BATTLE ENGINE
// ═══════════════════════════════════════════════
function stgMul(s){const v=Math.max(-6,Math.min(6,s));return v>=0?(2+v)/2:2/(2-v);}

function execMove(att,def,mname,atkSt,defSt){
  const mv=MOVES[mname];if(!mv)return{dmg:0,miss:true,text:'???'};
  const acc=mv.acc+wAccMod(mv.type,mname);
  if(Math.random()*100>acc)return{dmg:0,miss:true,text:`${att.name} missed!`};
  if(mv.effect){const txt=applyEff(mv.effect,att);return{dmg:0,miss:false,text:txt,isEffect:true};}
  const eff=getEff(mv.type,def.type);
  const pm=1+wPowMod(mv.type)/100;
  const base=mv.pow*(att.atk/100)*stgMul(atkSt)*pm;
  const red=base*(100/(100+def.def*stgMul(defSt)));
  const dmg=Math.max(1,Math.round(red*eff*(0.85+Math.random()*.15)*.8));
  let effT=eff>=2?"It's super effective!":eff<=.5?"Not very effective...":'';
  let stT='';
  if(mv.status&&mv.sChance>0&&Math.random()*100<mv.sChance&&applyStatus(def,mv.status))stT=` ${def.name} is ${mv.status}!`;
  return{dmg,eff,miss:false,text:`${att.name} used ${mname}! ${effT}${stT}`.trim()};
}
function applyEff(eff,att){
  const b=G.battle,ip=att===getAP();
  if(eff==='atk+2'){b.atkSt[ip?0:1]+=2;return`${att.name}'s ATK sharply rose!`;}
  if(eff==='def+2'){b.defSt[ip?0:1]+=2;return`${att.name}'s DEF sharply rose!`;}
  if(eff==='eatk-2'){b.atkSt[ip?1:0]-=2;return`Enemy ATK harshly fell!`;}
  return '';
}

function doPlayerMove(mname){
  const b=G.battle,p=getAP(),e=getAE();
  const sc=checkStatus(p);
  if(sc.skip){showDlg(sc.msg);b.phase='MOVE_EXEC';b.pendEnemy=true;return;}
  const res=execMove(p,e,mname,b.atkSt[0],b.defSt[1]);
  b.pendRes=res;
  const mv=MOVES[mname];
  const col=TYPES[p.type]?.color||'#fff';
  b.phase='ANIMATING';
  startAnim(mv?mv.anim:'CRASH',120,115,320,115,col,()=>{
    if(!res.miss&&res.dmg>0){e.hp=Math.max(0,e.hp-res.dmg);b.fe=12;b.es=8;}
    showDlg(res.dmg>0?`${res.text} (-${res.dmg})`:res.text);
    b.phase='MOVE_EXEC';b.pendEnemy=e.hp>0;
  });
}
function doEnemyMove(){
  const b=G.battle,p=getAP(),e=getAE();
  if(!e||e.hp<=0){checkFaints();return;}
  const sc=checkStatus(e);
  if(sc.skip){showDlg(sc.msg);b.phase='ENEMY_TURN';return;}
  const mname=e.moves[Math.floor(Math.random()*e.moves.length)];
  const res=execMove(e,p,mname,b.atkSt[1],b.defSt[0]);
  const mv=MOVES[mname];
  const col=TYPES[e.type]?.color||'#fff';
  b.phase='ANIMATING';
  startAnim(mv?mv.anim:'CRASH',320,115,120,115,col,()=>{
    if(!res.miss&&res.dmg>0){p.hp=Math.max(0,p.hp-res.dmg);b.fp=12;b.ps=8;}
    showDlg(res.dmg>0?`${res.text} (-${res.dmg})`:res.text);
    b.phase='ENEMY_TURN';
  });
}
function checkFaints(){
  const b=G.battle,p=getAP(),e=getAE();
  if(e&&e.hp<=0){
    const allOut=G.opponent.roster.every(x=>x.hp<=0);
    if(allOut){showDlg(`All of ${G.opponent.teamName}'s players down! YOU WIN!`);b.phase='WIN_BATTLE';return;}
    G.opActiveIdx++;showDlg(`${G.opponent.teamName} sends out ${getAE().name}!`);b.phase='DIALOG';return;
  }
  if(p.hp<=0){
    // Check if going to IR
    if(G.teamData&&G.teamData.bonusKey==='tackle_ir'&&p.status==='INJURED'){sendToIR(p);}
    else if(Math.random()<.25){sendToIR(p);}
    showDlg(`${p.name} is down! ${p.onIR?'Going to IR!':''}`);b.phase='FAINTED';return;
  }
  const stMsg=tickStatus(p);
  if(stMsg){showDlg(stMsg);b.phase='DIALOG';return;}
  b.phase='MENU';b.sel=0;
}
function sendToIR(p){
  if(p.onIR)return;
  p.onIR=true;p.irWeeks=2+Math.floor(Math.random()*3);
  G.ir.push(p);
  // Refresh free agents
  refreshFreeAgents();
}
function refreshFreeAgents(){
  const usedIds=new Set([...G.roster.map(p=>p.id),...G.ir.map(p=>p.id)]);
  const avail=BASE_PLAYERS.filter(b=>!usedIds.has(b.id));
  G.freeAgents=avail.sort(()=>Math.random()-.5).slice(0,4).map(b=>mkPlayer(b.id));
}
function useDraftPick(){
  const b=G.battle,e=getAE();
  if(G.draftPicks<=0){showDlg("No draft picks left!");b.phase='DIALOG';return;}
  const chance=(1-e.hp/e.maxHp)*.65+.1;G.draftPicks--;
  if(Math.random()<chance&&G.roster.length<6){
    const caught=mkPlayer(e.id);caught.hp=e.hp;G.roster.push(caught);e.hp=0;
    showDlg(`You signed ${e.name}! Added to roster! (${G.draftPicks} picks left)`);
  }else showDlg(`${e.name} broke free! (${G.draftPicks} picks left)`);
  b.phase='DIALOG';
}

function startBattle(opponent,isTrain=false){
  G.opponent=opponent;G.opActiveIdx=0;G.activeIdx=0;
  G.roster.forEach(p=>{if(!p.onIR){p.hp=p.maxHp;p.status=null;}});
  pickWeather(opponent.oppWeather||null);
  G.battle={phase:'DIALOG',sel:0,atkSt:[0,0],defSt:[0,0],pendRes:null,pendEnemy:false,ps:0,es:0,fp:0,fe:0,isTrain};
  showDlg(isTrain?`Training session begins! Go, ${getAP().name}!`:`${opponent.teamName}: "${opponent.greeting||'Let\'s play football!'}" Go, ${getAP().name}!`);
  G.screen='BATTLE';
}

function buildScheduleOpponent(weekData){
  const oT=NFL_TEAMS.find(t=>t.id===weekData.opponentId)||NFL_TEAMS[0];
  return{teamId:oT.id,teamName:oT.name,abbr:oT.abbr,oppWeather:weekData.oppWeather,greeting:getCoachGreeting(weekData.difficulty),roster:weekData.opponentRoster||buildOpponentRoster(oT,weekData.difficulty),reward:80+weekData.difficulty*60};
}
function buildTrainingOpponent(){
  const pool=[...BASE_PLAYERS].sort(()=>Math.random()-.5).slice(0,3).map(b=>{const p=mkPlayer(b.id);p.maxHp=p.hp=Math.round(p.maxHp*.5);p.atk=Math.round(p.atk*.55);p.lvl=3+Math.floor(Math.random()*4);return p;});
  return{teamId:'practice',teamName:'Practice Squad',abbr:'PRE',oppWeather:'CLEAR',greeting:'Time to grind!',roster:pool,reward:30};
}
function getCoachGreeting(diff){const g=['Let\'s go out and play our game today!','We\'re taking you down. Plain and simple.','You don\'t stand a chance. Trust me.','This is a MUST WIN for us. Buckle up.'];return g[Math.min(diff-1,3)];}

function afterBattleWin(){
  const b=G.battle;const xp=b.isTrain?40:80+((currentWeekData()||{}).difficulty||1)*40;
  const lus=[];
  G.roster.forEach(p=>{
    if(p.hp>0&&!p.onIR){
      p.xp=(p.xp||0)+xp;
      const needed=100+p.lvl*20;
      if(p.xp>=needed){p.lvl++;p.xp=0;p.maxHp=Math.round(p.maxHp*1.05);p.hp=p.maxHp;p.atk=Math.round(p.atk*1.02);lus.push({name:p.name,from:p.lvl-1,to:p.lvl});}
    }
  });
  G.levelUps=lus;
  if(!b.isTrain){
    const w=currentWeekData();if(w)w.result='W';
    G.postResult='W';
    checkEvolutions();
  }
  if(G.evolving){G.screen='EVOLUTION';return;}
  G.screen=b.isTrain?'SEASON_HUB':'POST_GAME';
}
function afterBattleLoss(){
  if(!G.battle.isTrain){const w=currentWeekData();if(w)w.result='L';G.postResult='L';}
  checkEvolutions();
  if(G.evolving){G.screen='EVOLUTION';return;}
  G.screen=G.battle.isTrain?'SEASON_HUB':'POST_GAME';
}
function checkEvolutions(){
  for(const p of G.roster){if(!p.evolved&&p.lvl>=EVOLVE_LVL){G.evolving=p;return;}}
  G.evolving=null;
}
function doEvolve(p){
  p.evolved=true;p.name='E.'+p.name;
  p.maxHp=Math.round(p.maxHp*1.2);p.hp=p.maxHp;
  p.atk=Math.round(p.atk*1.15);p.def=Math.round(p.def*1.1);p.spd=Math.round(p.spd*1.08);
  G.evolving=null;
}

function advanceWeek(){
  // Heal on bye, tick IR
  if(currentWeekData()?.type==='BYE'){G.roster.forEach(p=>{p.hp=p.maxHp;p.status=null;});}
  G.ir.forEach(p=>{p.irWeeks--;if(p.irWeeks<=0){p.onIR=false;G.roster=G.roster.filter(r=>r.id!==p.id);G.ir=G.ir.filter(i=>i.id!==p.id);}});
  G.season.week=Math.min(17,G.season.week+1);
  // Check for trade offer
  if(Math.random()<.3&&G.roster.length>=2){genTradeOffer();}
  if(G.season.week>16)enterPlayoffs();
}
function genTradeOffer(){
  const oT=NFL_TEAMS[Math.floor(Math.random()*NFL_TEAMS.length)];
  const theirPlayer=mkPlayer(BASE_PLAYERS[Math.floor(Math.random()*BASE_PLAYERS.length)].id);
  const yourPlayer=G.roster[Math.floor(Math.random()*G.roster.length)];
  const picks=Math.floor(Math.random()*3)+1;
  G.tradeOffer={fromTeam:oT.id,theirPlayer,yourPlayer,picks};
}
function acceptTrade(){
  const o=G.tradeOffer;if(!o)return;
  G.roster=G.roster.filter(p=>p.id!==o.yourPlayer.id);
  G.roster.push(o.theirPlayer);
  G.draftPicks=Math.max(0,G.draftPicks-o.picks);
  G.tradeOffer=null;G.notif='TRADE ACCEPTED!';G.notifTimer=90;
}
function enterPlayoffs(){
  const w=wins();
  if(w<8){G.screen='LOSE';return;}
  G.screen='SEASON_HUB';G.notif=`PLAYOFFS! ${w}-${losses()} — You made it!`;G.notifTimer=120;
  // Build playoff schedule
  const diff=w>=10?3:2;
  const opp1=NFL_TEAMS.filter(t=>t.id!==G.teamId).sort(()=>Math.random()-.5)[0];
  G.season.schedule.push(
    {week:17,type:'GAME',opponentId:opp1.id,opponentName:opp1.name,opponentAbbr:opp1.abbr,oppC1:opp1.c1,oppC2:opp1.c2,oppWeather:opp1.weather,difficulty:diff,result:null,isHome:false,event:'NONE',opponentRoster:buildOpponentRoster(opp1,diff),greeting:'Wild Card time!'},
  );
  const opp2=NFL_TEAMS.filter(t=>t.id!==G.teamId&&t.id!==opp1.id).sort(()=>Math.random()-.5)[0];
  G.season.schedule.push(
    {week:18,type:'GAME',opponentId:opp2.id,opponentName:opp2.name,opponentAbbr:opp2.abbr,oppC1:opp2.c1,oppC2:opp2.c2,oppWeather:opp2.weather,difficulty:diff+1,result:null,isHome:false,event:'NONE',opponentRoster:buildOpponentRoster(opp2,diff+1),greeting:'Championship game!'},
  );
  const opp3=NFL_TEAMS.filter(t=>t.id!==G.teamId&&t.id!==opp1.id&&t.id!==opp2.id).sort(()=>Math.random()-.5)[0];
  G.season.schedule.push(
    {week:19,type:'GAME',opponentId:opp3.id,opponentName:'Super Bowl Opponent',opponentAbbr:'SB',oppC1:opp3.c1,oppC2:opp3.c2,oppWeather:'DOME',difficulty:4,result:null,isHome:false,event:'NONE',opponentRoster:buildOpponentRoster(opp3,4),greeting:'Welcome to the Super Bowl!'},
  );
}

function startSeason(){
  G.teamData=NFL_TEAMS.find(t=>t.id===G.teamId)||NFL_TEAMS[0];
  G.season.schedule=generateSchedule(G.teamId);
  G.season.week=1;
  refreshFreeAgents();
  G.draftPicks=5;G.score=0;G.ir=[];
  // Build starter choices (one QB, one RB, one WR)
  const qb=BASE_PLAYERS.filter(p=>p.type==='QB').sort(()=>Math.random()-.5)[0];
  const rb=BASE_PLAYERS.filter(p=>p.type==='RB').sort(()=>Math.random()-.5)[0];
  const wr=BASE_PLAYERS.filter(p=>p.type==='WR').sort(()=>Math.random()-.5)[0];
  G.starterChoices=[mkPlayer(qb.id),mkPlayer(rb.id),mkPlayer(wr.id)];
  G.starterCursor=0;
}
function confirmStarter(){
  const star=G.starterChoices[G.starterCursor];
  const rest=BASE_PLAYERS.filter(p=>p.id!==star.id).sort(()=>Math.random()-.5).slice(0,2).map(b=>mkPlayer(b.id));
  G.roster=[star,...rest];G.activeIdx=0;
}
function resetGame(){G.screen='TITLE';G.tick=0;G.evolving=null;G.tradeOffer=null;G.battle=null;}

function update(){
  for(const k in KEYS){KJ[k]=KEYS[k]&&!KL[k];KL[k]=KEYS[k];}
  G.tick++;updateDlg();tickAnim();

  const s=G.screen;
  if(s==='TITLE'){
    if(KJ.a){G.goodellStep=0;showDlg(goodellLine(0));G.screen='GOODELL';}
  }
  else if(s==='GOODELL'){
    if(KJ.a){
      if(G.dlgTyping){G.dlgTyping=false;G.dlgDone=true;G.dlgIdx=G.dlgText.length;return;}
      if(!G.dlgDone)return;
      if(G.goodellStep===3){G.screen='TEAM_SELECT';return;}
      if(G.goodellStep===7){showNameInput();return;}
      if(G.goodellStep===9){G.screen='PRESS_CONF';G.pressStep=0;showDlg(pressLine(0));return;}
      G.goodellStep++;showDlg(goodellLine(G.goodellStep));
    }
  }
  else if(s==='TEAM_SELECT'){
    const cols=4;
    if(KJ.up)   G.teamCursor=Math.max(0,G.teamCursor-cols);
    if(KJ.down) G.teamCursor=Math.min(NFL_TEAMS.length-1,G.teamCursor+cols);
    if(KJ.left) G.teamCursor=Math.max(0,G.teamCursor-1);
    if(KJ.right)G.teamCursor=Math.min(NFL_TEAMS.length-1,G.teamCursor+1);
    if(KJ.a){G.teamId=NFL_TEAMS[G.teamCursor].id;G.teamData=NFL_TEAMS[G.teamCursor];G.goodellStep=4;showDlg(goodellLine(4));G.screen='GOODELL';}
  }
  else if(s==='PRESS_CONF'){
    if(G.pressStep===1&&G.dlgDone){
      if(KJ.left) G.starterCursor=Math.max(0,G.starterCursor-1);
      if(KJ.right)G.starterCursor=Math.min(2,G.starterCursor+1);
      if(KJ.a){confirmStarter();G.pressStep=2;showDlg(pressLine(2));}
    } else {
      if(KJ.a){
        if(G.dlgTyping){G.dlgTyping=false;G.dlgDone=true;G.dlgIdx=G.dlgText.length;return;}
        if(!G.dlgDone)return;
        G.pressStep++;
        if(G.pressStep>=pressLines.length){G.screen='SEASON_HUB';G.cursor=0;}
        else showDlg(pressLine(G.pressStep));
      }
    }
  }
  else if(s==='SEASON_HUB'){
    const acts=G._hubActions||[];
    if(KJ.left) G.cursor=Math.max(0,G.cursor-1);
    if(KJ.right)G.cursor=Math.min(acts.length-1,G.cursor+1);
    if(KJ.a&&acts[G.cursor]){
      const k=acts[G.cursor].key;
      if(k==='play'){
        const w=currentWeekData();
        if(w){if(w.type==='BYE'){advanceWeek();}else{const opp=buildScheduleOpponent(w);startBattle(opp);}}
      }
      if(k==='train'){const opp=buildTrainingOpponent();startBattle(opp,true);}
      if(k==='fa'){G.screen='FREE_AGENCY';G.subCursor=0;}
      if(k==='trade'){G.screen='TRADE';G.tradeCursor=0;}
      if(k==='bye'){advanceWeek();}
    }
  }
  else if(s==='FREE_AGENCY'){
    if(KJ.up)  G.subCursor=Math.max(0,G.subCursor-1);
    if(KJ.down)G.subCursor=Math.min(G.freeAgents.length-1,G.subCursor+1);
    if(KJ.b)   G.screen='SEASON_HUB';
    if(KJ.a&&G.freeAgents[G.subCursor]){
      if(G.draftPicks>0){
        const p=G.freeAgents[G.subCursor];
        G.roster.push(p);G.freeAgents.splice(G.subCursor,1);G.draftPicks--;
        G.notif=`Signed ${p.name}!`;G.notifTimer=80;G.screen='SEASON_HUB';
      } else {G.notif='No picks left!';G.notifTimer=60;}
    }
  }
  else if(s==='TRADE'){
    if(KJ.b){G.screen='SEASON_HUB';}
    if(KJ.left) G.tradeCursor=0;
    if(KJ.right)G.tradeCursor=1;
    if(KJ.a){if(G.tradeOffer){if(G.tradeCursor===0)acceptTrade();else G.tradeOffer=null;}G.screen='SEASON_HUB';}
  }
  else if(s==='BATTLE'){
    const b=G.battle;if(!b)return;
    if(b.phase==='ANIMATING')return;
    if(b.phase==='DIALOG'){if(KJ.a){if(G.dlgTyping){G.dlgTyping=false;G.dlgDone=true;G.dlgIdx=G.dlgText.length;return;}if(G.dlgDone)b.phase='MENU';}}
    else if(b.phase==='MENU'){
      if(KJ.up||KJ.left) b.sel=(b.sel+2)%4;
      if(KJ.down||KJ.right)b.sel=(b.sel+2)%4;
      if(KJ.a){if(b.sel===0){b.phase='MOVES';b.sel=0;}else if(b.sel===1){b.phase='ROSTER_SW';G.subCursor=0;}else if(b.sel===2)useDraftPick();else{showDlg("Can't run from an official game!");b.phase='DIALOG';}}
    }
    else if(b.phase==='MOVES'){
      if(KJ.up||KJ.left) b.sel=(b.sel+2)%4;
      if(KJ.down||KJ.right)b.sel=(b.sel+2)%4;
      if(KJ.b){b.phase='MENU';b.sel=0;}
      if(KJ.a)doPlayerMove(getAP().moves[b.sel]);
    }
    else if(b.phase==='ROSTER_SW'){
      if(KJ.up)  G.subCursor=Math.max(0,G.subCursor-1);
      if(KJ.down)G.subCursor=Math.min(G.roster.length-1,G.subCursor+1);
      if(KJ.b){b.phase='MENU';}
      if(KJ.a){const t=G.roster[G.subCursor];if(G.subCursor===G.activeIdx){showDlg(`${t.name} is already in!`);b.phase='DIALOG';}else if(t.hp<=0||t.onIR){showDlg(`${t.name} can't play!`);b.phase='DIALOG';}else{G.activeIdx=G.subCursor;showDlg(`Go, ${t.name}!`);b.phase='DIALOG';}}
    }
    else if(b.phase==='MOVE_EXEC'){if(KJ.a){if(G.dlgTyping){G.dlgTyping=false;G.dlgDone=true;G.dlgIdx=G.dlgText.length;return;}if(G.dlgDone){if(b.pendEnemy){b.pendEnemy=false;doEnemyMove();}else checkFaints();}}}
    else if(b.phase==='ENEMY_TURN'){if(KJ.a){if(G.dlgTyping){G.dlgTyping=false;G.dlgDone=true;G.dlgIdx=G.dlgText.length;return;}if(G.dlgDone)checkFaints();}}
    else if(b.phase==='FAINTED'){
      if(KJ.a){if(G.dlgTyping){G.dlgTyping=false;G.dlgDone=true;G.dlgIdx=G.dlgText.length;return;}
        if(G.dlgDone){
          if(G.roster.filter(p=>p.hp>0&&!p.onIR).length===0){afterBattleLoss();}
          else if(G.opponent.roster.every(p=>p.hp<=0)){afterBattleWin();}
          else{b.phase='ROSTER_SW';G.subCursor=0;}
        }
      }
    }
    else if(b.phase==='WIN_BATTLE'){if(KJ.a){if(G.dlgTyping){G.dlgTyping=false;G.dlgDone=true;G.dlgIdx=G.dlgText.length;return;}if(G.dlgDone)afterBattleWin();}}
  }
  else if(s==='POST_GAME'){
    if(KJ.a){
      advanceWeek();
      if(G.season.week>19)G.screen=wins()>=2?'WIN':'LOSE'; // after playoffs
      else G.screen='SEASON_HUB';G.cursor=0;
    }
  }
  else if(s==='EVOLUTION'){
    if(KJ.a&&G.evolving){doEvolve(G.evolving);checkEvolutions();if(!G.evolving){if(G.screen==='EVOLUTION')G.screen=G.battle?.isTrain?'SEASON_HUB':'POST_GAME';}}
  }
  else if(s==='WIN'||s==='LOSE'){if(KJ.a)resetGame();}
}

// ═══════════════════════════════════════════════
// MAIN DRAW
// ═══════════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,480,320);
  const s=G.screen;
  if(s==='TITLE')     drawTitle();
  else if(s==='GOODELL')    drawGoodell();
  else if(s==='TEAM_SELECT')drawTeamSelect();
  else if(s==='PRESS_CONF') drawPressConf();
  else if(s==='SEASON_HUB') drawSeasonHub();
  else if(s==='FREE_AGENCY')drawFreeAgency();
  else if(s==='TRADE')      drawTrade();
  else if(s==='BATTLE')     drawBattle();
  else if(s==='POST_GAME')  drawPostGame();
  else if(s==='EVOLUTION')  drawEvolution();
  else if(s==='WIN')        drawWin();
  else if(s==='LOSE')       drawLose();
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script></body></html>
